/* =========================================

function renderApps() {
const appList =
    document.getElementById("app-list");

appList.innerHTML = "";

apps.forEach((app, index) => {

    const card =
        document.createElement("div");

    card.className = "app-card";

    card.innerHTML = `
        <div class="app-name">
            ${app.name}
        </div>

        <div class="app-description">
            ${app.description}
        </div>
    `;

    card.addEventListener("click", function() {
        openDetails(index);
    });

    appList.appendChild(card);
});
}
renderApps();

 // -------------------- Share --------------------

    function shareCard() {
  if (navigator.share) {
    navigator.share({
      title: "Andrii - Web Developer",
      text: "Моя цифровая визитка:",
      url: window.location.href
    });
  } else {
    alert("Функция поделиться не поддерживается этим браузером");
  }
}

  

/* =========================================

   ОТКРЫТИЕ ИНСТРУКЦИИ

========================================= */
function openDetails(index) {

    const app = apps[index];

    document.getElementById("modalTitle")

        .textContent = app.name;

    document.getElementById("modalBody")

        .innerHTML = app.details;

    const modal =

        new bootstrap.Modal(

            document.getElementById("detailsModal")

        );

   modal.show();
}
function showStepPhoto(id) {
const photo = stepPhotos[id];

if (!photo) {
    return;
}

document.getElementById("stepPhoto").src = photo;

document.getElementById("photoModal").style.display = "flex";
}
function closeStepPhoto() {
document.getElementById("photoModal").style.display = "none";

document.getElementById("stepPhoto").src = "";
}

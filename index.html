<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">
  <title>box market</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Bootstrap -->
   <link
     href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
     rel="stylesheet">
     <style>

        body {
            background: #f5f5f5;
            margin: 0;
            font-family: Arial, sans-serif;

        }

         .container {
              max-width: 600px;

        }
          .page-title {
                text-align: center;
                margin: 20px 0;
                font-size: 24px;
                font-weight: 700;
          }
         /* Кнопка операции */
           .app-card {
                 background: #fff;
                 border-radius: 6px;
                 padding: 18px;
                 margin-bottom: 0px;
                 box-shadow: none;
                 border: 1px solid #dee2e6;
                 cursor: pointer;
                 transition: transform .1s;

        }
            .app-card:active {
                 transform: scale(.98);
        }
            .app-name {
                 font-size: 18px;
                 font-weight: 600;
         }
            .app-description {
                 font-size: 14px;
                 color: #666;
                 margin-top: 5px;
          }
         /* Полноэкранный вид Modal */
           .modal-dialog {
                 margin: 0;
                 max-width: none;
                 width: 100%;
                 height: 100%;
            }

         .modal-content {
               height: 100vh;
               border: none;
               border-radius: 0;

        }
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;

        }
        .modal-title {
             font-size: 20px;
             font-weight: 700;
        }
         .modal-body {
              padding: 20px;
              overflow-y: auto;
              font-size: 17px;
              line-height: 1.6;
        }
             /* Номера шагов */
         .step {
             margin-bottom: 20px;

        }
         .step-number {
              font-weight: 700;
              font-size: 18px;
         }
          /* Нижняя кнопка */
       .close-button {
             width: 100%;
             margin-top: 20px;
             padding: 14px;
             font-size: 17px;
             font-weight: 600;
             border-radius: 12px;
           }
     

.photo-btn:active {
    transform: scale(0.85);
}
.step-number {
    display: flex;
    align-items: center;
    gap: 8px;
}

.photo-btn {
    border: none;
    background: none;
    padding: 0;
    margin-left: 8px;
    font-size: 20px;
    cursor: pointer;
    vertical-align: middle;
}   
  .photo-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.photo-modal img {
    max-width: 95%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 8px;
}

.photo-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: white;
    font-size: 35px;
    cursor: pointer;
}    
     </style>
     </head>
   <body>
     <div class="container">
          <div class="page-title">

        box market

    </div>
      <div id="app-list"></div>
     </div>

      <!-- Modal -->
     <div
     class="modal fade"
     id="detailsModal"
      tabindex="-1"
>

  <div class="modal-dialog">
       <div class="modal-content">
       <div class="modal-header">
        <h5
           class="modal-title"
           id="modalTitle"
         ></h5>
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Закрыть"
              ></button>
          </div>
                      <div
                class="modal-body"
                id="modalBody"
             ></div>

            <div class="px-3 pb-3">
                 <button
                     type="button"
                     class="btn btn-secondary close-button"
                     data-bs-dismiss="modal"
                    >

                    ← Назад

                </button>
                <div id="photoModal" class="photo-modal" onclick="closeStepPhoto()">
                <span class="photo-close">×</span>
                <img id="stepPhoto" src="" onclick="event.stopPropagation()">
                </div>
              </div>
           </div>
          </div>
         </div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

<script>
/* =========================================

   ОПЕРАЦИИ 1С

========================================= */

const apps = [
      {
        name: "Открыть смену",
        description:

            "Оформление продажи покупателю.",

         details: `
              <div class="step">
               <div class="step-number">

                    ШАГ 1
               <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>
                     Откройте рабочее место кассира.
                 </div>

                <div class="step">
                <div class="step-number">

                    ШАГ 2
                <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>
                 Найдите нужный товар.
                 </div>

               <div class="step">
               <div class="step-number">

                    ШАГ 3
                <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>

                  Укажите количество товара.

                  </div>

               <div class="step">
                  <div class="step-number">

                    ШАГ 4
                <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>
                   Проверьте сумму покупки.
                </div>

              <div class="step">
                 <div class="step-number">

                    ШАГ 5
                <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>
                   Выберите способ оплаты.
                 </div>

                <div class="step">
                <div class="step-number">

                    ШАГ 6
                <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>
                Завершите оформление продажи.
                </div>
           `

    },

     {
        name: "Продажа товара",
        description:

            "Оформление продажи покупателю.",

         details: `
              <div class="step">
               <div class="step-number">

                    ШАГ 1

                </div>
                     Откройте рабочее место кассира.
                 </div>

                <div class="step">
                <div class="step-number">

                    ШАГ 2

                </div>
                 Найдите нужный товар.
                 </div>

               <div class="step">
               <div class="step-number">

                    ШАГ 3

                </div>

                  Укажите количество товара.

                  </div>

               <div class="step">
                  <div class="step-number">

                    ШАГ 4

                </div>
                   Проверьте сумму покупки.
                </div>

              <div class="step">
                 <div class="step-number">

                    ШАГ 5

                </div>
                   Выберите способ оплаты.
                 </div>

                <div class="step">
                <div class="step-number">

                    ШАГ 6

                </div>
                Завершите оформление продажи.
                </div>
           `

    },
    {
        name: "Возврат товара",
        description:

            "Оформление возврата от покупателя.",

            details: `
              <div class="step">
            <div class="step-number">

                    ШАГ 1

                </div>
                   Найдите документ продажи.
                </div>

                <div class="step">

                <div class="step-number">

                    ШАГ 2

                </div>
                  Выберите товар,
                  который возвращает покупатель.
                 </div>
                 <div class="step">
                 <div class="step-number">

                    ШАГ 3

                </div>
                  Укажите количество возвращаемого товара.
                </div>

            <div class="step">

                <div class="step-number">

                    ШАГ 4

                </div>

                Оформите возврат.

            </div>

        `

    },

    {

        name: "Приём товара",

        description:

            "Оформление поступления товара.",

        details: `

            <div class="step">

                <div class="step-number">

                    ШАГ 1

                </div>

                Откройте раздел поступления товара.

            </div>

            <div class="step">

                <div class="step-number">

                    ШАГ 2

                </div>

                Выберите поставщика.

            </div>

            <div class="step">

                <div class="step-number">

                    ШАГ 3

                </div>

                Добавьте поступившие товары.

            </div>

            <div class="step">

                <div class="step-number">

                    ШАГ 4

                </div>

                Проверьте количество и стоимость.

            </div>

            <div class="step">

                <div class="step-number">

                    ШАГ 5

                </div>

                Проведите документ.

            </div>

        `

    },
    {

        name: "Закрыть кассу",
           description:

            "Порядок действий при завершении работы.",
           details: `
            <div class="step">
              <div class="step-number">

                    ШАГ 1
           <button class="photo-btn" onclick="showStepPhoto('open-shift-1')">📷</button>

                </div>
                Клацніть на кнопку "Упр.змінами ЕККА".
            </div>

            <div class="step">
              <div class="step-number">

                    ШАГ 2

                </div>
                Клацніть -"Инкасація".
            </div>
            <div class="step">
              <div class="step-number">

                    ШАГ 3

                </div>
                Клацніть-"Показать сумми"(сфотографуй за потреби ).
             </div>
               <div class="step">
                <div class="step-number">
                    ШАГ 4
                </div>
              Клацніть-"Инкасація"

          </div>
       `
    }
];
const stepPhotos = {
    "open-shift-1": "images/open-shift-1.jpg",
    "open-shift-2": "images/open-shift-2.jpg",
    "open-shift-3": "images/open-shift-3.jpg",
    "open-shift-4": "images/open-shift-4.jpg",
    "open-shift-5": "images/open-shift-5.jpg",
    "open-shift-6": "images/open-shift-6.jpg"
};
/* =========================================

   СОЗДАНИЕ КНОПОК

========================================= */
function renderApps() {
const appList =
    document.getElementById("app-list");

appList.innerHTML = "";

apps.forEach((app, index) => {

    const card =
        document.createElement("div");

    card.className = "app-card";

    card.innerHTML = `
        <div class="app-name">
            ${app.name}
        </div>

        <div class="app-description">
            ${app.description}
        </div>
    `;

    card.addEventListener("click", function() {
        openDetails(index);
    });

    appList.appendChild(card);
});
}
renderApps();

/* =========================================

   ОТКРЫТИЕ ИНСТРУКЦИИ

========================================= */
function openDetails(index) {

    const app = apps[index];

    document.getElementById("modalTitle")

        .textContent = app.name;

    document.getElementById("modalBody")

        .innerHTML = app.details;

    const modal =

        new bootstrap.Modal(

            document.getElementById("detailsModal")

        );

   modal.show();
}
function showStepPhoto(id) {
const photo = stepPhotos[id];

if (!photo) {
    return;
}

document.getElementById("stepPhoto").src = photo;

document.getElementById("photoModal").style.display = "flex";
}
function closeStepPhoto() {
document.getElementById("photoModal").style.display = "none";

document.getElementById("stepPhoto").src = "";
}
</script>
</body>
</html>
